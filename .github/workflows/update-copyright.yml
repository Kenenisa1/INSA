name: Update Copyright Year

on:
  schedule:
    # Runs at 00:00 on January 1st every year
    - cron: '0 0 1 1 *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Copyright Year
        run: |
          CURRENT_YEAR=$(date +'%Y')
          sed -i -E "s/© [0-9]{4} Kenenisa Mieso/© ${CURRENT_YEAR} Kenenisa Mieso/g" README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update copyright year to $(date +'%Y')" && git push)